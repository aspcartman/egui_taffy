[package]
name = "egui_taffy"
version = "0.14.0"
edition = "2024"
authors = ["Pēteris Pakalns"]
repository = "https://github.com/PPakalns/egui_taffy/"
homepage = "https://github.com/PPakalns/egui_taffy/"
description = "Grid, Flexbox, Block layout support for egui using taffy"
keywords = ["egui", "flexbox", "taffy", "layout", "ui"]
categories = ["gui"]
license = "MIT"
rust-version = "1.95"
exclude = ["/.github", "./examples/web/"]

[dependencies]
stackbox = "0.2"
# Keep UI types from egui's current master branch, including Transform3D.
egui = { git = "https://github.com/aspcartman/egui.git", branch = "master", default-features = false }
log = { version = "0.4", default-features = false }
taffy = { version = "0.9.2", default-features = false, features = [
  "taffy_tree",
  "detailed_layout_info",
] }
parking_lot = { version = "0.12", features = ["arc_lock"] }
tracing = { version = "0.1", optional = true }

[features]
default = ["taffy_default"]

taffy_default = [
  "taffy/block_layout",
  "taffy/content_size",
  "taffy/flexbox",
  "taffy/grid",
  "taffy/std",
]
tracing = ["dep:tracing"]

[dev-dependencies]
wgpu = "30" # enables the wgpu default features so we get the default backends

eframe = { git = "https://github.com/aspcartman/egui.git", branch = "master", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "wgpu",
  "wayland",
  "web_screen_reader",
  "x11",
] }
